{% extends "base.html" %}
{% block title %}身份设置 · 每日 AI 简报{% endblock %}
{% block heading %}身份设置{% endblock %}
{% block content %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if saved %}<p class="ok">已保存。</p>{% endif %}

<form method="post" action="/profile" class="card">
  <p>
    姓名<br>
    <input type="text" name="name" value="{{ profile.name if profile else '' }}"
           maxlength="100" required>
  </p>
  <p>
    收件邮箱<br>
    <input type="email" name="email" value="{{ profile.email if profile else '' }}" required>
    <span class="muted">每日简报将发送到这个邮箱。</span>
  </p>
  <p><button type="submit">保存</button></p>
</form>
{% endblock %}
