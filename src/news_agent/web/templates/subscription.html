{% extends "base.html" %}
{% block title %}订阅设置 · 每日 AI 简报{% endblock %}
{% block heading %}订阅设置{% endblock %}
{% block content %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if saved %}<p class="ok">已保存。</p>{% endif %}

<form method="post" action="/subscription" class="card">
  <p>
    关注话题<span class="muted">（一行一个，或逗号分隔）</span><br>
    <textarea name="topics">{{ subscription.topics | join("\n") }}</textarea>
  </p>
  <p>
    关键词<span class="muted">（一行一个）</span><br>
    <textarea name="keywords">{{ subscription.keywords | join("\n") }}</textarea>
  </p>
  <p>
    排除词<span class="muted">（标题或内容命中任意一个即排除该条）</span><br>
    <textarea name="exclude_keywords">{{ subscription.exclude_keywords | join("\n") }}</textarea>
  </p>
  <p>
    每天最多条数<br>
    <input type="number" name="max_items" min="1" max="50"
           value="{{ subscription.max_items }}" required>
  </p>
  <p><button type="submit">保存</button></p>
</form>
{% endblock %}
