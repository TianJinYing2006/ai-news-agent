[project]
name = "news-agent"
version = "0.1.0"
description = "每日 AI 新闻助手 Agent —— 手写 ReAct 循环驱动，工具调用顺序由模型决定"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",          # DeepSeek 走 OpenAI 兼容协议
    "feedparser>=6.0",       # RSS 主源
    "trafilatura>=2.0",      # 网页正文抽取
    "httpx>=0.27",
    "fastapi[standard]>=0.115",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "tavily-python>=0.5",
    "markdown-it-py>=3.0",   # Markdown → HTML（关闭原始 HTML）
    "nh3>=0.2",              # HTML 净化 allowlist，不用手写 sanitizer
    "apscheduler>=3.10,<4",  # 进程内调度：随 FastAPI 启动，每日自动运行
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
